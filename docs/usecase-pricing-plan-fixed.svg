<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-label="Corrected GENTEK pricing plan use case diagram">
  <rect width="980" height="620" fill="#ffffff"/>

  <style>
    .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #111827; }
    .label { font: 600 18px Arial, Helvetica, sans-serif; fill: #111827; }
    .small { font: 15px Arial, Helvetica, sans-serif; fill: #4b5563; }
    .usecase { font: 700 18px Arial, Helvetica, sans-serif; fill: #3f3c91; }
    .include { font: 15px Arial, Helvetica, sans-serif; fill: #6b7280; }
    .actor-line { stroke: #111827; stroke-width: 4; stroke-linecap: round; fill: none; }
    .connector { stroke: #6b7280; stroke-width: 2.5; fill: none; }
    .include-line { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Actor -->
  <circle cx="100" cy="190" r="22" class="actor-line"/>
  <path d="M100 212 L100 300 M52 244 L148 244 M100 300 L58 365 M100 300 L142 365" class="actor-line"/>
  <text x="100" y="405" text-anchor="middle" class="label">Registered User</text>

  <!-- System boundary -->
  <rect x="230" y="70" width="690" height="480" rx="14" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="260" y="110" class="title">GENTEK Pricing Plan Page</text>
  <text x="260" y="136" class="small">Current system scope: viewing pricing options and selecting a plan</text>

  <!-- Use cases -->
  <ellipse cx="575" cy="205" rx="170" ry="48" fill="#e9e7ff" stroke="#8b82dd" stroke-width="1.5"/>
  <text x="575" y="212" text-anchor="middle" class="usecase">View pricing plans</text>

  <ellipse cx="575" cy="320" rx="170" ry="48" fill="#e9e7ff" stroke="#8b82dd" stroke-width="1.5"/>
  <text x="575" y="327" text-anchor="middle" class="usecase">Toggle annual billing</text>

  <ellipse cx="575" cy="440" rx="170" ry="48" fill="#e9e7ff" stroke="#8b82dd" stroke-width="1.5"/>
  <text x="575" y="447" text-anchor="middle" class="usecase">Select premium plan</text>

  <ellipse cx="575" cy="115" rx="170" ry="42" fill="#dcf5ed" stroke="#5aa391" stroke-width="1.5"/>
  <text x="575" y="122" text-anchor="middle" style="font:700 18px Arial, Helvetica, sans-serif; fill:#0f6b58;">Display annual savings</text>

  <ellipse cx="785" cy="320" rx="105" ry="42" fill="#e9e7ff" stroke="#8b82dd" stroke-width="1.5"/>
  <text x="785" y="327" text-anchor="middle" class="usecase">Close page</text>

  <!-- Actor associations -->
  <path d="M148 244 L405 205" class="connector"/>
  <path d="M148 244 L405 320" class="connector"/>
  <path d="M148 244 L405 440" class="connector"/>
  <path d="M148 244 L680 320" class="connector"/>

  <!-- Include relationship -->
  <path d="M575 272 L575 158" class="include-line"/>
  <text x="602" y="220" class="include">&lt;&lt;include&gt;&gt;</text>
</svg>
