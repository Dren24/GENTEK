<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GENTEK System Diagram</title>
<style>
  body { margin: 0; background: #fff; display: flex; justify-content: center; padding: 40px 20px; font-family: 'Segoe UI', Arial, sans-serif; }
</style>
</head>
<body>
<svg width="860" height="820" viewBox="0 0 860 820" xmlns="http://www.w3.org/2000/svg">

  <!-- ── Outer dashed border ── -->
  <rect x="10" y="10" width="840" height="800" rx="12" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- ROW 1 — INPUT SOURCES                     -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Box: User Text Input -->
  <rect x="40" y="35" width="145" height="52" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="112" y="57" text-anchor="middle" font-size="11" font-weight="600">User Text</text>
  <text x="112" y="73" text-anchor="middle" font-size="11" font-weight="600">Input</text>

  <!-- Box: Document Upload -->
  <rect x="210" y="35" width="145" height="52" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="282" y="57" text-anchor="middle" font-size="11" font-weight="600">Document Upload</text>
  <text x="282" y="73" text-anchor="middle" font-size="10" fill="#555">PDF / DOCX / TXT</text>

  <!-- Box: Sample Templates -->
  <rect x="380" y="35" width="145" height="52" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="452" y="57" text-anchor="middle" font-size="11" font-weight="600">Sample</text>
  <text x="452" y="73" text-anchor="middle" font-size="11" font-weight="600">Templates</text>

  <!-- Box: User Account -->
  <rect x="550" y="35" width="145" height="52" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="622" y="57" text-anchor="middle" font-size="11" font-weight="600">User Account</text>
  <text x="622" y="73" text-anchor="middle" font-size="10" fill="#555">Auth &amp; History</text>

  <!-- Arrow: Row 1 → Row 2 (converge to center) -->
  <line x1="112" y1="87" x2="112" y2="118" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="282" y1="87" x2="282" y2="118" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="452" y1="87" x2="452" y2="118" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="622" y1="87" x2="622" y2="118" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- ROW 2 — PREPROCESSING                     -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Box: Text Storage -->
  <rect x="40" y="118" width="130" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="105" y="141" text-anchor="middle" font-size="11" font-weight="600">Text Storage</text>
  <text x="105" y="157" text-anchor="middle" font-size="10" fill="#555">&amp; Session Cache</text>

  <!-- Dashed arrow: Storage → Preprocessing -->
  <line x1="170" y1="145" x2="210" y2="145" stroke="#555" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Box: Text Cleaning & Preprocessing -->
  <rect x="210" y="118" width="175" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="297" y="139" text-anchor="middle" font-size="11" font-weight="600">Text Cleaning &amp;</text>
  <text x="297" y="155" text-anchor="middle" font-size="11" font-weight="600">Preprocessing</text>
  <text x="297" y="169" text-anchor="middle" font-size="9" fill="#888">(HTML escape, tokenize)</text>

  <!-- Arrow: Preprocessing → Feature Engineering -->
  <line x1="385" y1="145" x2="420" y2="145" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Box: Feature Engineering -->
  <rect x="420" y="118" width="175" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="507" y="139" text-anchor="middle" font-size="11" font-weight="600">Feature</text>
  <text x="507" y="155" text-anchor="middle" font-size="11" font-weight="600">Engineering</text>
  <text x="507" y="169" text-anchor="middle" font-size="9" fill="#888">(word boundaries, patterns)</text>

  <!-- Arrow: Row 2 → Row 3 -->
  <line x1="297" y1="173" x2="297" y2="205" stroke="#333" stroke-width="1.3"/>
  <line x1="507" y1="173" x2="507" y2="205" stroke="#333" stroke-width="1.3"/>
  <line x1="297" y1="205" x2="430" y2="205" stroke="#333" stroke-width="1.3"/>
  <line x1="507" y1="205" x2="430" y2="205" stroke="#333" stroke-width="1.3"/>
  <line x1="430" y1="205" x2="430" y2="220" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- ROW 3 — AI ENGINE                         -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Box: Hybrid AI Analysis Engine (wide) -->
  <rect x="240" y="220" width="380" height="62" rx="8" fill="none" stroke="#333" stroke-width="2"/>
  <text x="430" y="244" text-anchor="middle" font-size="13" font-weight="700">Hybrid AI Analysis Engine</text>
  <text x="430" y="263" text-anchor="middle" font-size="10" fill="#555">Pattern Matching + HuggingFace Llama 3.1 8B Instruct</text>
  <text x="430" y="278" text-anchor="middle" font-size="9" fill="#888">(router.huggingface.co / FastAPI /analyze endpoint)</text>

  <!-- Arrow: Engine → Row 4 -->
  <line x1="430" y1="282" x2="430" y2="315" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- ROW 4 — DETECTION OUTPUTS                 -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Box: Bias Classification -->
  <rect x="95" y="315" width="155" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="172" y="338" text-anchor="middle" font-size="11" font-weight="600">Bias</text>
  <text x="172" y="354" text-anchor="middle" font-size="11" font-weight="600">Classification</text>
  <text x="172" y="368" text-anchor="middle" font-size="9" fill="#888">(Male / Female / Neutral / Mixed)</text>

  <!-- Box: Bias Score Calculation (center) -->
  <rect x="295" y="315" width="270" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="430" y="338" text-anchor="middle" font-size="11" font-weight="600">Bias Score Calculation</text>
  <text x="430" y="354" text-anchor="middle" font-size="10" fill="#555">&amp; Result Merging</text>
  <text x="430" y="368" text-anchor="middle" font-size="9" fill="#888">(0–100% score · deduplicate detections)</text>

  <!-- Box: Suggestion Generation -->
  <rect x="610" y="315" width="155" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="687" y="338" text-anchor="middle" font-size="11" font-weight="600">Suggestion</text>
  <text x="687" y="354" text-anchor="middle" font-size="11" font-weight="600">Generation</text>
  <text x="687" y="368" text-anchor="middle" font-size="9" fill="#888">(neutral word replacements)</text>

  <!-- Arrows: Score → Classification and → Suggestion -->
  <line x1="295" y1="342" x2="250" y2="342" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="565" y1="342" x2="610" y2="342" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Arrows: Row 4 → Row 5 -->
  <line x1="172" y1="370" x2="172" y2="410" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="430" y1="370" x2="430" y2="410" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="687" y1="370" x2="687" y2="410" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- ROW 5 — FEATURES (dashed group box)       -->
  <!-- ══════════════════════════════════════════ -->

  <rect x="35" y="410" width="790" height="130" rx="10" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="6,4"/>

  <!-- Box: Word Highlighting -->
  <rect x="50" y="428" width="120" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="450" text-anchor="middle" font-size="10" font-weight="600">Word</text>
  <text x="110" y="464" text-anchor="middle" font-size="10" font-weight="600">Highlighting</text>
  <text x="110" y="478" text-anchor="middle" font-size="9" fill="#888">(color-coded marks)</text>

  <!-- Box: Apply Fix / Apply All -->
  <rect x="185" y="428" width="120" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="245" y="450" text-anchor="middle" font-size="10" font-weight="600">Apply Fix /</text>
  <text x="245" y="464" text-anchor="middle" font-size="10" font-weight="600">Apply All</text>
  <text x="245" y="478" text-anchor="middle" font-size="9" fill="#888">(one-click replace)</text>

  <!-- Box: Real-Time Re-Analysis -->
  <rect x="320" y="428" width="120" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="380" y="450" text-anchor="middle" font-size="10" font-weight="600">Real-Time</text>
  <text x="380" y="464" text-anchor="middle" font-size="10" font-weight="600">Re-Analysis</text>
  <text x="380" y="478" text-anchor="middle" font-size="9" fill="#888">(score updates live)</text>

  <!-- Box: Analysis History -->
  <rect x="455" y="428" width="120" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="515" y="450" text-anchor="middle" font-size="10" font-weight="600">Analysis</text>
  <text x="515" y="464" text-anchor="middle" font-size="10" font-weight="600">History</text>
  <text x="515" y="478" text-anchor="middle" font-size="9" fill="#888">(sidebar · PostgreSQL)</text>

  <!-- Box: Notification & Account -->
  <rect x="590" y="428" width="120" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="650" y="450" text-anchor="middle" font-size="10" font-weight="600">Notification</text>
  <text x="650" y="464" text-anchor="middle" font-size="10" font-weight="600">&amp; Account</text>
  <text x="650" y="478" text-anchor="middle" font-size="9" fill="#888">(email alerts · settings)</text>

  <!-- Box: About / Pricing -->
  <rect x="725" y="428" width="88" height="55" rx="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="769" y="450" text-anchor="middle" font-size="10" font-weight="600">About &amp;</text>
  <text x="769" y="464" text-anchor="middle" font-size="10" font-weight="600">Pricing</text>
  <text x="769" y="478" text-anchor="middle" font-size="9" fill="#888">(plans · FAQ)</text>

  <!-- Arrow: Feature group → Final box -->
  <line x1="430" y1="540" x2="430" y2="575" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- BOTTOM — SYSTEM NAME                      -->
  <!-- ══════════════════════════════════════════ -->

  <rect x="195" y="575" width="470" height="62" rx="8" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="430" y="601" text-anchor="middle" font-size="13">
    <tspan font-weight="800">GENTEK:</tspan>
    <tspan font-weight="400"> An AI-Powered Gender</tspan>
  </text>
  <text x="430" y="622" text-anchor="middle" font-size="13" font-weight="400">Bias Detection and Text Improvement System</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- LEGEND                                    -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="40" y="665" width="780" height="55" rx="8" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="687" font-size="10" font-weight="700" fill="#333">Legend:</text>
  <line x1="100" y1="684" x2="135" y2="684" stroke="#333" stroke-width="1.3"/>
  <text x="140" y="688" font-size="9" fill="#555">Process flow</text>
  <line x1="210" y1="684" x2="245" y2="684" stroke="#555" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="250" y="688" font-size="9" fill="#555">Data feed</text>
  <rect x="320" y="677" width="40" height="16" rx="3" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="340" y="689" text-anchor="middle" font-size="8" fill="#333">solid</text>
  <text x="365" y="688" font-size="9" fill="#555">Core module</text>
  <rect x="430" y="677" width="40" height="16" rx="3" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="4,2"/>
  <text x="450" y="689" text-anchor="middle" font-size="8" fill="#555">dash</text>
  <text x="475" y="688" font-size="9" fill="#555">User-facing feature</text>
  <rect x="575" y="677" width="200" height="16" rx="3" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="6,3"/>
  <text x="675" y="689" text-anchor="middle" font-size="9" fill="#555">Feature group boundary</text>

  <!-- ── Arrowhead marker ── -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>

</svg>
</body>
